<style>
#erd svg { max-width: 100%; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
p{
  color:black;
}
</style>
<h2 class="sr-only">ERD TOUPAC — Modules IAM, Flotte, Géographie, Voyage (27 tables)</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram

  tenants {
    uuid id PK
    varchar name
    char country_code
    char currency
    varchar timezone
    varchar status
  }

  users {
    uuid id PK
    uuid tenant_id FK
    varchar email UK
    varchar phone
    varchar role
    boolean is_active
  }

  vehicle_types {
    uuid id PK
    uuid tenant_id FK
    varchar name
    int default_capacity
  }

  vehicles {
    uuid id PK
    uuid tenant_id FK
    uuid vehicle_type_id FK
    varchar plate_number
    varchar status
    geography location
  }

  drivers {
    uuid id PK
    uuid tenant_id FK
    uuid user_id FK
    varchar license_number
    varchar status
    decimal score
  }

  fleets {
    uuid id PK
    uuid tenant_id FK
    varchar name
    uuid manager_id FK
  }

  places {
    uuid id PK
    uuid tenant_id FK
    varchar name
    varchar city
    char country_code
    geography location
  }

  zones {
    uuid id PK
    uuid tenant_id FK
    varchar name
    varchar type
    geography boundary
  }

  routes {
    uuid id PK
    uuid tenant_id FK
    varchar name
    varchar code UK
    uuid origin_place_id FK
    uuid destination_place_id FK
    uuid luggage_policy_id FK
  }

  route_stops {
    uuid id PK
    uuid route_id FK
    uuid place_id FK
    smallint stop_order
    int offset_minutes
  }

  schedules {
    uuid id PK
    uuid tenant_id FK
    uuid route_id FK
    time departure_time
    int default_price_xof
  }

  seat_maps {
    uuid id PK
    uuid tenant_id FK
    uuid vehicle_type_id FK
    int total_seats
    jsonb layout
  }

  trips {
    uuid id PK
    uuid tenant_id FK
    uuid route_id FK
    uuid vehicle_id FK
    uuid driver_id FK
    uuid seat_map_id FK
    varchar internal_id UK
    date departure_date
    varchar status
    int booked_seats
  }

  trip_stops {
    uuid id PK
    uuid trip_id FK
    uuid route_stop_id FK
    uuid place_id FK
    timestamptz eta
    timestamptz ata
    varchar status
  }

  passengers {
    uuid id PK
    uuid tenant_id FK
    varchar first_name
    varchar last_name
    varchar phone
    varchar id_type
    varchar id_number
  }

  reservations {
    uuid id PK
    uuid tenant_id FK
    uuid trip_id FK
    uuid passenger_id FK
    varchar seat_label
    varchar status
    int amount_xof
    text qr_code_jwt
    uuid boarded_by FK
  }

  luggage_policies {
    uuid id PK
    uuid tenant_id FK
    int included_kg
    int max_kg
    int excess_price_per_kg
  }

  controllers {
    uuid id PK
    uuid tenant_id FK
    uuid user_id FK
    varchar matricule UK
    decimal score_conformity
  }

  control_sessions {
    uuid id PK
    uuid tenant_id FK
    uuid trip_id FK
    uuid controller_id FK
    varchar device_id
    varchar sync_state
  }

  control_events {
    uuid id PK
    uuid tenant_id FK
    uuid session_id FK
    uuid client_uuid UK
    varchar event_type
    jsonb payload
    varchar status
  }

  anomalies {
    uuid id PK
    uuid tenant_id FK
    uuid session_id FK
    uuid event_id FK
    varchar type
    varchar severity
    varchar status
  }

  incidents {
    uuid id PK
    uuid tenant_id FK
    uuid session_id FK
    uuid trip_id FK
    uuid reporter_id FK
    varchar type
    varchar severity
  }

  cash_entries {
    uuid id PK
    uuid tenant_id FK
    uuid session_id FK
    uuid reservation_id FK
    int amount_xof
    varchar reason
  }

  tenants ||--o{ users : "employs"
  tenants ||--o{ vehicles : "owns"
  tenants ||--o{ drivers : "manages"
  tenants ||--o{ routes : "operates"
  tenants ||--o{ trips : "runs"

  users ||--o| drivers : "is"
  users ||--o| controllers : "is"

  vehicle_types ||--o{ vehicles : "type"
  vehicle_types ||--o{ seat_maps : "layout"

  vehicles ||--o{ trips : "assigned"
  drivers ||--o{ trips : "drives"

  fleets }o--|| tenants : "belongs"

  places ||--o{ route_stops : "located at"
  routes ||--o{ route_stops : "has stops"
  routes ||--o{ schedules : "scheduled"
  routes ||--o{ trips : "instance"
  routes }o--|| luggage_policies : "policy"

  seat_maps ||--o{ trips : "seats"
  schedules ||--o{ trips : "generates"

  trips ||--o{ trip_stops : "visits"
  trips ||--o{ reservations : "carries"
  trips ||--o{ control_sessions : "controlled"
  trips ||--o{ incidents : "reports"

  passengers ||--o{ reservations : "books"

  controllers ||--o{ control_sessions : "opens"
  controllers ||--o{ reservations : "boards"

  control_sessions ||--o{ control_events : "records"
  control_sessions ||--o{ anomalies : "flags"
  control_sessions ||--o{ cash_entries : "collects"
  control_sessions ||--o{ incidents : "reports"

  control_events ||--o{ anomalies : "triggers"
  reservations ||--o{ cash_entries : "paid via"
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
