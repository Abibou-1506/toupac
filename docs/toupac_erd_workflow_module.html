<style>
#erd3 svg { max-width: 100%; }
#erd3 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd3 svg.erDiagram .row-rect-odd path,
#erd3 svg.erDiagram .row-rect-odd rect,
#erd3 svg.erDiagram .row-rect-even path,
#erd3 svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">ERD TOUPAC — Module Workflow et ses liens avec les entités métier</h2>
<div id="erd3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd3-svg', `erDiagram

  tenants {
    uuid id PK
    varchar name
    char currency
  }

  workflow_definitions {
    uuid id PK
    uuid tenant_id FK
    varchar entity_type
    varchar name
    int version
    boolean is_active
    boolean is_system
  }

  workflow_states {
    uuid id PK
    uuid workflow_id FK
    varchar code
    varchar label
    varchar color
    smallint display_order
    boolean is_initial
    boolean is_terminal
    jsonb config
  }

  workflow_transitions {
    uuid id PK
    uuid workflow_id FK
    uuid from_state_id FK
    uuid to_state_id FK
    varchar trigger
    varchar event_type
    jsonb guard
    smallint priority
  }

  workflow_hooks {
    uuid id PK
    uuid transition_id FK
    varchar hook_type
    jsonb config
    smallint execution_order
  }

  trips {
    uuid id PK
    uuid tenant_id FK
    varchar internal_id UK
    varchar status
    uuid route_id FK
    uuid vehicle_id FK
    uuid driver_id FK
  }

  orders {
    uuid id PK
    uuid tenant_id FK
    varchar internal_id UK
    varchar status
    varchar priority
    uuid pickup_place_id FK
    uuid dropoff_place_id FK
  }

  delivery_tasks {
    uuid id PK
    uuid tenant_id FK
    uuid order_id FK
    uuid driver_id FK
    varchar type
    varchar status
    int sequence_order
  }

  parcels {
    uuid id PK
    uuid tenant_id FK
    uuid order_id FK
    varchar tracking_number UK
    varchar status
  }

  reservations {
    uuid id PK
    uuid tenant_id FK
    uuid trip_id FK
    uuid passenger_id FK
    varchar seat_label
    varchar status
  }

  incidents {
    uuid id PK
    uuid tenant_id FK
    uuid trip_id FK
    varchar type
    varchar status
  }

  audit_logs {
    uuid id PK
    uuid tenant_id FK
    uuid user_id FK
    varchar action
    varchar resource_type
    uuid resource_id
    jsonb changes
  }

  tenants ||--o{ workflow_definitions : "configures"
  workflow_definitions ||--o{ workflow_states : "has states"
  workflow_definitions ||--o{ workflow_transitions : "has transitions"

  workflow_states ||--o{ workflow_transitions : "from"
  workflow_states ||--o{ workflow_transitions : "to"

  workflow_transitions ||--o{ workflow_hooks : "triggers"

  workflow_definitions ||..o{ trips : "governs status"
  workflow_definitions ||..o{ orders : "governs status"
  workflow_definitions ||..o{ delivery_tasks : "governs status"
  workflow_definitions ||..o{ parcels : "governs status"
  workflow_definitions ||..o{ incidents : "governs status"

  trips ||--o{ reservations : "carries"
  orders ||--o{ parcels : "contains"
  orders ||--o{ delivery_tasks : "fulfilled by"
`);
document.getElementById('erd3').innerHTML = svg;
document.querySelectorAll('#erd3 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd3 svg.erDiagram .row-rect-odd path, #erd3 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
