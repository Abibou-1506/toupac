[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "*/migrations/*",
    "*/__pycache__/*",
    "staticfiles",
    "media",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "RUF012",  # Django/DRF idiom (permission_classes, list_display, etc.)
    "E501",    # line-too-long — laissé au formatter, pas au linter
    "B008",    # Do not perform function calls in argument defaults — Django Field defaults courants
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F401", "F403", "F405"]  # from base import *
"*/tests/*.py" = ["S101"]  # assert autorisé dans les tests
